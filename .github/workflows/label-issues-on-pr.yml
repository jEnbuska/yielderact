name: Label linked issues when PR is opened

on:
  pull_request:
    types: [opened]
    branches: [dev, main]

permissions:
  issues: write

jobs:
  label-issues:
    name: Add 'PR Opened' label to linked issues
    runs-on: ubuntu-latest

    steps:
      - name: Label referenced issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Extract issue numbers from Closes #N, Fixes #N, Resolves #N (case-insensitive)
          issues=$(echo "$PR_BODY" | grep -ioP '(close[sd]?|fix(e[sd])?|resolve[sd]?)\s+#\K\d+' | sort -u)

          if [ -z "$issues" ]; then
            echo "No linked issues found in PR #$PR_NUMBER body"
            exit 0
          fi

          for issue in $issues; do
            echo "Adding 'PR Opened' label to issue #$issue (linked from PR #$PR_NUMBER)"
            gh issue edit "$issue" --repo "$GITHUB_REPOSITORY" --add-label "PR Opened" || echo "Warning: could not label issue #$issue"
          done
