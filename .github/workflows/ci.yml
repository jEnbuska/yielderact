name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

jobs:
  ci:
    name: Test, Build & Format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # Node 26 is required, not preferred: src/general.ts and
      # src/slots/slot-keys.ts call Map.prototype.getOrInsertComputed, which
      # ships in V8 14.6. The whole Node 24 line is pinned to V8 13.6, so it
      # cannot run this package at any patch level.
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install playground dependencies
        run: npm ci --prefix playground

      - name: Dead code check
        run: npm run knip

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      - name: Type check playground
        run: npm run typecheck:playground

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  visual:
    name: Visual Tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    needs: ci
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install playground dependencies
        run: npm ci --prefix playground

      - name: Install Playwright browser
        run: npm run playwright:install --prefix playground -- ${{ matrix.browser }}

      - name: Visual tests
        run: npm test --prefix playground -- --project=${{ matrix.browser }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playground/playwright-report/
          retention-days: 7
