name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

jobs:
  ci:
    name: Test, Build & Format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install examples dependencies
        run: npm ci --prefix examples

      - name: Dead code check
        run: npm run knip

      - name: Lint & format check
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  beta:
    name: Beta package (Node 26)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # Node 26 is required, not preferred: src/general.ts and
      # src/slots/slot-keys.ts call Map.prototype.getOrInsertComputed, which
      # ships in V8 14.6. The whole Node 24 line is pinned to V8 13.6, so it
      # cannot run this package at any patch level.
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: beta/package-lock.json

      - name: Install dependencies
        working-directory: beta
        run: npm ci

      - name: Type check
        working-directory: beta
        run: npm run typecheck

      - name: Test
        working-directory: beta
        run: npm test

  visual:
    name: Visual Tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    needs: ci
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Build library
        run: npm run build

      - name: Install examples dependencies
        run: npm ci --prefix examples

      - name: Install Playwright browser
        working-directory: examples
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Visual tests
        working-directory: examples
        run: npx playwright test --project=${{ matrix.browser }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report-${{ matrix.browser }}
          path: examples/playwright-report/
          retention-days: 7
